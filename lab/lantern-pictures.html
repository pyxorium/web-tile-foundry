<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glass Lantern picture maker</title>
    <style>
      body { margin: 0; padding: 16px; background: #f4efe6; color: #2a211b; font: 15px/1.45 system-ui, sans-serif; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 14px; }
      figure { margin: 0; background: #fff; border-radius: 10px; padding: 6px; }
      figure img { display: block; width: 100%; border-radius: 6px; }
      figcaption { font-size: 13px; padding: 4px 2px 0; display: flex; justify-content: space-between; }
      #status { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Glass Lantern picture maker</h1>
    <p>Draws the Foundry's Shape and Style pictures (development only). Save each one into <code>public/glass-lantern/</code> with the name shown.</p>
    <p id="status">Drawing…</p>
    <div class="grid" id="grid"></div>
    <script type="module" src="./lantern-pictures.js"></script>
  </body>
</html>
